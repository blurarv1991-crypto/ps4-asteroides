name: Ver codigo

on:
  workflow_dispatch:

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar sample
        run: git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git src

      - name: Ver Projectile
        run: |
          for f in Projectile.h Projectile.cpp; do echo "===== $f ====="; cat -n src/samples/SDL2/SDL2/$f; done

      - name: Ver Player TTF HUD
        run: |
          for f in Player.cpp TTF.h HUD.h; do echo "===== $f ====="; cat -n src/samples/SDL2/SDL2/$f; done
